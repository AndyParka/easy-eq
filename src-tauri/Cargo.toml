[package]
name = "easy-eq"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Focused, per-ear headphone equalizer"

[lib]
name = "easy_eq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
easy-eq-core = { path = "../crates/easy-eq-core" }
easy-eq-devices = { path = "../crates/easy-eq-devices" }
easy-eq-bridge = { path = "../crates/easy-eq-bridge" }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6.0"
