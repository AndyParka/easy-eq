name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Test DSP, transport, devices and editor
        shell: pwsh
        run: |
          foreach ($crate in @('easy-eq-core', 'easy-eq-bridge', 'easy-eq-devices', 'easy-eq-desktop')) {
            cargo test --locked --manifest-path "crates/$crate/Cargo.toml"
            if ($LASTEXITCODE) { throw "Tests failed: $crate" }
          }
          cargo build --locked --manifest-path crates/easy-eq-vst/Cargo.toml
          if ($LASTEXITCODE) { throw 'Audio DLL build failed' }
          cargo test --locked --manifest-path crates/easy-eq-vst/Cargo.toml
          if ($LASTEXITCODE) { throw 'Audio DLL tests failed' }
      - name: Build installer and dependency source
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Easy-EQ-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Easy-EQ-windows-x64
          path: artifacts/release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content crates/easy-eq-desktop/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match the app version' }
          $assets = @(Get-ChildItem artifacts/release -File | Where-Object { $_.Extension -in @('.exe','.zip','.txt') } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Easy EQ $version" --notes-file "docs/release-notes-$version.md"
          if ($LASTEXITCODE) { throw 'Release upload failed' }
